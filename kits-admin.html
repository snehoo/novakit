<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaKit Kits — Metrics</title>
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #16161a;
    --surface-2: #1e1e23;
    --border: #2a2a30;
    --text: #f2f0eb;
    --text-dim: #9b98a3;
    --accent: #ff7a59;
    --accent-dim: #b85a42;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --font-display: 'Georgia', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 16px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .wordmark { font-family: var(--font-display); font-size: 1.4rem; }
  .wordmark em { color: var(--accent); font-style: normal; }
  .subtitle { color: var(--text-dim); font-size: 0.85rem; }
  .kit-badge {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  #gate {
    max-width: 380px;
    margin: 80px auto;
    text-align: center;
  }
  #gate input {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
    margin-top: 16px;
  }
  #gate button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #1a1005;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #gate button:hover { background: #ff8c6d; }
  #gate-error { color: var(--bad); font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }

  #dashboard { display: none; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .card .value {
    font-size: 1.8rem;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .card .sub { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; }

  section { margin-bottom: 28px; }
  h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 0 0 12px 0;
  }

  .funnel { display: flex; gap: 8px; flex-wrap: wrap; }
  .funnel-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .funnel-item .n { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 1.1rem; }
  .funnel-item .s { font-size: 0.78rem; color: var(--text-dim); }
  .pill { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .pill.trial { background: var(--text-dim); }
  .pill.trial_expired { background: var(--warn); }
  .pill.pending_payment { background: var(--warn); }
  .pill.active { background: var(--good); }
  .pill.payment_failed { background: var(--bad); }
  .pill.churned { background: var(--border); }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--text-dim);
    font-weight: 500;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    background: var(--surface);
  }
  tr:last-child td { border-bottom: none; }
  td.status-active { color: var(--good); }
  td.status-payment_failed { color: var(--bad); }
  td.status-trial_expired, td.status-pending_payment { color: var(--warn); }
  .empty-row td { color: var(--text-dim); text-align: center; padding: 24px; }

  #error-banner {
    display: none;
    background: #3a1a1a;
    border: 1px solid var(--bad);
    color: #ffb4b4;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 0.9rem;
  }
  #refresh-note { color: var(--text-dim); font-size: 0.78rem; text-align: right; margin-top: -16px; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="gate">
  <div class="wordmark">Nova<em>Kit</em></div>
  <p class="subtitle">Kits metrics — admin token required</p>
  <input type="password" id="token-input" placeholder="Admin token" autocomplete="off">
  <button id="gate-submit">View dashboard</button>
  <div id="gate-error"></div>
</div>

<div class="wrap" id="dashboard">
  <header>
    <div>
      <div class="wordmark">Nova<em>Kit</em> — Kits Metrics</div>
      <div class="subtitle">Live from the production database</div>
    </div>
    <span class="kit-badge" id="kit-badge">property</span>
  </header>

  <div id="error-banner"></div>
  <div id="refresh-note"></div>

  <div class="cards" id="top-cards"></div>

  <section>
    <h2>Funnel</h2>
    <div class="funnel" id="funnel"></div>
  </section>

  <section>
    <h2>Recent signups</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Business</th><th>Phone</th><th>Source</th><th>Status</th><th>Signed up</th></tr>
        </thead>
        <tbody id="recent-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const API_BASE = 'https://aiservices-snehoo.duckdns.org';
const STATUS_LABELS = {
  trial: 'Trial', trial_expired: 'Trial expired', pending_payment: 'Pending payment',
  active: 'Active', payment_failed: 'Payment failed', churned: 'Churned'
};

function fmtInr(n) {
  return '₹' + Number(n).toLocaleString('en-IN');
}
function fmtPct(n) {
  return n === null || n === undefined ? '—' : Math.round(n * 1000) / 10 + '%';
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ' '
    + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}
function maskPhone(p) {
  if (!p || p.length < 6) return p || '—';
  return p.slice(0, 4) + '••••' + p.slice(-2);
}

async function loadMetrics(token) {
  const res = await fetch(API_BASE + '/admin/kits-metrics?kit=property', {
    headers: { 'X-Admin-Token': token }
  });
  if (res.status === 401) throw new Error('Wrong admin token.');
  if (res.status === 503) throw new Error('Dashboard disabled server-side (no admin token configured).');
  if (!res.ok) throw new Error('Server error (' + res.status + ').');
  return res.json();
}

function render(data) {
  document.getElementById('kit-badge').textContent = data.kit_slug;

  const cards = [
    { label: 'Signups today', value: data.signups.signups_today },
    { label: 'Signups (7d)', value: data.signups.signups_7d },
    { label: 'Signups (30d)', value: data.signups.signups_30d,
      sub: data.signups.trial_signups_30d + ' trial · ' + data.signups.buy_now_signups_30d + ' buy now' },
    { label: 'Trial → paid', value: fmtPct(data.trial_conversion_rate) },
    { label: 'Active subscriptions', value: data.active_subscriptions },
    { label: 'MRR', value: fmtInr(data.mrr_inr) },
    { label: 'Ghost nudges (7d)', value: data.ghost_sweep.nudged_7d,
      sub: data.ghost_sweep.never_nudged + ' expired, not yet nudged' },
  ];
  document.getElementById('top-cards').innerHTML = cards.map(c =>
    '<div class="card"><div class="label">' + c.label + '</div>' +
    '<div class="value">' + c.value + '</div>' +
    (c.sub ? '<div class="sub">' + c.sub + '</div>' : '') +
    '</div>').join('');

  const order = ['trial', 'trial_expired', 'pending_payment', 'active', 'payment_failed', 'churned'];
  document.getElementById('funnel').innerHTML = order.map(s =>
    '<div class="funnel-item"><span class="pill ' + s + '"></span>' +
    '<span class="n">' + (data.funnel[s] || 0) + '</span>' +
    '<span class="s">' + STATUS_LABELS[s] + '</span></div>').join('');

  const rows = data.recent_signups;
  document.getElementById('recent-body').innerHTML = rows.length ? rows.map(r =>
    '<tr>' +
    '<td>' + (r.business_name || '—') + '</td>' +
    '<td>' + maskPhone(r.owner_phone) + '</td>' +
    '<td>' + (r.signup_source || 'unknown') + '</td>' +
    '<td class="status-' + r.status + '">' + (STATUS_LABELS[r.status] || r.status) + '</td>' +
    '<td>' + fmtDate(r.created_at) + '</td>' +
    '</tr>').join('') : '<tr class="empty-row"><td colspan="5">No signups yet.</td></tr>';

  document.getElementById('refresh-note').textContent = 'Refreshed ' + new Date().toLocaleTimeString('en-IN');
}

async function boot(token) {
  const errorBanner = document.getElementById('error-banner');
  try {
    const data = await loadMetrics(token);
    errorBanner.style.display = 'none';
    render(data);
  } catch (e) {
    errorBanner.textContent = e.message;
    errorBanner.style.display = 'block';
  }
}

document.getElementById('gate-submit').addEventListener('click', async () => {
  const token = document.getElementById('token-input').value.trim();
  const errEl = document.getElementById('gate-error');
  if (!token) { errEl.textContent = 'Enter the admin token.'; return; }
  errEl.textContent = '';
  try {
    const data = await loadMetrics(token);
    try { sessionStorage.setItem('novakit_admin_token', token); } catch (_) {}
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    render(data);
    setInterval(() => boot(token), 60000);
  } catch (e) {
    errEl.textContent = e.message;
  }
});
document.getElementById('token-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('gate-submit').click();
});

(function tryStoredToken() {
  let stored = null;
  try { stored = sessionStorage.getItem('novakit_admin_token'); } catch (_) {}
  if (stored) {
    document.getElementById('token-input').value = stored;
    document.getElementById('gate-submit').click();
  }
})();
</script>

</body>
</html>
